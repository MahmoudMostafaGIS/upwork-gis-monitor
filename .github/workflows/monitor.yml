name: Upwork GIS Monitor

on:
  schedule:
    # Every 10 minutes.
    - cron: "1-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upwork-gis-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GIS monitor
        env:
          UPWORK_ACCESS_TOKEN: ${{ secrets.UPWORK_ACCESS_TOKEN }}
          UPWORK_CLIENT_ID: ${{ secrets.UPWORK_CLIENT_ID }}
          UPWORK_CLIENT_SECRET: ${{ secrets.UPWORK_CLIENT_SECRET }}
          UPWORK_REFRESH_TOKEN: ${{ secrets.UPWORK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save seen-job state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_jobs.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update seen GIS jobs"
            git push
          fi
